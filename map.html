<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>MVGR Campus Map</title>

    <link rel="stylesheet"
          href="map.css">

    <!-- Leaflet CSS -->
    <link
        rel="stylesheet"
        href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
    >

</head>

<body>

    <h1>🗺️ MVGR Campus Map</h1>

    <div id="map"></div>


    <!-- Leaflet JavaScript -->
    <script
        src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js">
    </script>


    <script>

        // ================= CREATE MAP =================

        const map = L.map('map').setView(
            [18.060619, 83.405117],
            17
        );


        // ================= OPEN STREET MAP =================

        L.tileLayer(
            'https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',
            {
                attribution:
                '&copy; OpenStreetMap contributors'
            }
        ).addTo(map);


        // ================= MVGR COLLEGE MARKER =================

        L.marker([18.060619, 83.405117])
            .addTo(map)
            .bindPopup(
                "<b>MVGR College of Engineering</b><br>" +
                "Chintalavalasa, Vizianagaram"
            )
            .openPopup();
        // ================= USER LOCATION =================

        let userLocation = null;

        let userMarker = null;


        map.locate({
            setView: true,
            maxZoom: 18,
            enableHighAccuracy: true
        });


        map.on('locationfound', function(e) {

            userLocation = e.latlng;


            // Remove old user marker
            if (userMarker) {
                map.removeLayer(userMarker);
            }


            // Add current location marker
            userMarker = L.marker(e.latlng)
                .addTo(map)
                .bindPopup("📍 You are here")
                .openPopup();

        });


        // ================= LOCATION ERROR =================

        map.on('locationerror', function() {

            alert(
                "Unable to find your location. " +
                "Please allow location access."
            );

        });


        // ================= SELECT DESTINATION =================

        let destinationMarker = null;

        let routeLine = null;
        // Get coordinates by clicking on map
map.on('click', function(e) {
    console.log(
        "Latitude:", e.latlng.lat,
        "Longitude:", e.latlng.lng
    );

    alert(
        "Latitude: " + e.latlng.lat +
        "\nLongitude: " + e.latlng.lng
    );
});


        map.on('click', function(e) {

            // Check current location
            if (userLocation === null) {

                alert(
                    "Please wait for your current location."
                );

                return;
            }


            // Destination location
            const destination = e.latlng;


            // Remove previous destination marker
            if (destinationMarker) {
                map.removeLayer(destinationMarker);
            }


            // Remove previous route
            if (routeLine) {
                map.removeLayer(routeLine);
            }


            // Add destination marker
            destinationMarker = L.marker(destination)
                .addTo(map)
                .bindPopup("🎯 Destination")
                .openPopup();


            // ================= CREATE ROUTE =================

            const start = userLocation;

            const end = destination;


            const routeURL =
                "https://router.project-osrm.org/route/v1/driving/" +
                start.lng + "," + start.lat +
                ";" +
                end.lng + "," + end.lat +
                "?overview=full&geometries=geojson";


            fetch(routeURL)

                .then(response => response.json())

                .then(data => {

                    if (
                        !data.routes ||
                        data.routes.length === 0
                    ) {

                        alert(
                            "No route found for this location."
                        );

                        return;
                    }


                    const route =
                        data.routes[0];


                    // Draw route on map
                    routeLine = L.geoJSON(
                        route.geometry,
                        {
                            style: {
                                color: "blue",
                                weight: 6
                            }
                        }
                    ).addTo(map);


                    // Show route distance
                    const distance =
                        (route.distance / 1000).toFixed(2);


                    alert(
                        "🛣️ Route found!\n" +
                        "Distance: " +
                        distance +
                        " km"
                    );

                })

                .catch(error => {

                    console.log(error);

                    alert(
                        "Unable to create route."
                    );

                });

        });

    </script>

</body>

</html>
