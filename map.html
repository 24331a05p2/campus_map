<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width, initial-scale=1.0">

<title>MVGR Campus Navigation</title>

<link rel="stylesheet" href="map.css">

<link rel="stylesheet"
href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">

<style>

#routeInfo {
    position: fixed;
    bottom: 20px;
    left: 20px;
    right: 20px;
    background: white;
    padding: 16px;
    border-radius: 16px;
    box-shadow: 0 4px 18px rgba(0,0,0,0.25);
    z-index: 1000;
    font-family: Arial, sans-serif;
    max-width: 500px;
    margin: auto;
}

#routeInfo h3 {
    margin: 0 0 8px 0;
    color: #0B2D4D;
}

#routeDetails {
    font-size: 15px;
    color: #333;
    line-height: 1.7;
}

#voiceButton {
    margin-top: 10px;
    width: 100%;
    padding: 12px;
    border: none;
    border-radius: 10px;
    background: #1677FF;
    color: white;
    font-size: 15px;
    font-weight: bold;
    cursor: pointer;
}

#reachedMessage {
    display: none;
    margin-top: 10px;
    padding: 10px;
    border-radius: 10px;
    background: #DFF7E5;
    color: #167A35;
    font-weight: bold;
    text-align: center;
}

</style>

</head>

<body>

<h1>🗺️ MVGR Campus Navigation</h1>

<div id="map"></div>

<div id="routeInfo">

<h3 id="destinationTitle">
🎯 CSE Department
</h3>

<div id="routeDetails">
📍 Finding your live location...
</div>

<button id="voiceButton">
🔊 Start Voice Navigation
</button>

<div id="reachedMessage">
🏁 You have reached your destination!
</div>

</div>

<script
src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js">
</script>

<script>

/* =========================================
   DESTINATION DATA
   ========================================= */

const destinations = {

    cse: {
        name: "CSE Department",
        fullName: "Computer Science & Engineering",
        lat: 18.059794897461078,
        lng: 83.40501710170741
    },

    it: {
        name: "IT Department",
        fullName: "Information Technology",
        lat: 18.06089142240757,
        lng: 83.40532827907694
    },

    eee: {
        name: "EEE Department",
        fullName: "Electrical & Electronics Engineering",
        lat: 18.061814538103587,
        lng: 83.4055106565274
    },

    ece: {
        name: "ECE Department",
        fullName: "Electronics & Communication Engineering",
        lat: 18.060100905111256,
        lng: 83.4044054743864
    },

    mechanical: {
        name: "Mechanical Department",
        fullName: "Mechanical Engineering",
        lat: 18.060090704864844,
        lng: 83.40392261578708
    },

    civil: {
        name: "Civil Department",
        fullName: "Civil Engineering",
        lat: 18.062105242042335,
        lng: 83.40400305582341
    },

    chemical: {
        name: "Chemical Department",
        fullName: "Chemical Engineering",
        lat: 18.061814538103587,
        lng: 83.4055106565274
    }

};


/* =========================================
   GET DESTINATION FROM URL
   ========================================= */

const params =
    new URLSearchParams(window.location.search);

const selected =
    params.get("destination") || "cse";


const destination =
    destinations[selected] || destinations.cse;


/* =========================================
   MAP
   ========================================= */

const map = L.map("map").setView(
    [destination.lat, destination.lng],
    18
);


/* =========================================
   OPEN STREET MAP
   ========================================= */

L.tileLayer(
    "https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png",
    {
        attribution:
        "&copy; OpenStreetMap contributors"
    }
).addTo(map);


/* =========================================
   DESTINATION LOCATION
   ========================================= */

const destinationLocation =
    L.latLng(
        destination.lat,
        destination.lng
    );

map.setView(destinationLocation, 18);

/* =========================================
   DESTINATION MARKER
   ========================================= */

const destinationMarker =
    L.circleMarker(destinationLocation, {
        radius: 10,
        color: "#FF0000",
        fillColor: "#FF0000",
        fillOpacity: 1
    })
    .addTo(map)
    .bindPopup(
        "<b>🎯 " +
        destination.name +
        "</b><br>" +
        destination.fullName
    );


/* =========================================
   VARIABLES
   ========================================= */

let userLocation = null;

let userMarker = null;

let routeLine = null;

let routeSteps = [];

let voiceEnabled = false;

let destinationReached = false;

let lastSpokenStep = -1;


/* =========================================
   VOICE
   ========================================= */

function speak(text) {

    if (!voiceEnabled) {
        return;
    }

    if (!("speechSynthesis" in window)) {
        return;
    }

    window.speechSynthesis.cancel();

    const speech =
        new SpeechSynthesisUtterance(text);

    speech.lang = "en-IN";

    speech.rate = 0.9;

    window.speechSynthesis.speak(speech);
}


/* =========================================
   VOICE BUTTON
   ========================================= */

document.getElementById("voiceButton")
.addEventListener("click", function() {

    voiceEnabled = !voiceEnabled;

    if (voiceEnabled) {

        this.innerHTML =
            "🔊 Voice Navigation ON";

        this.style.background =
            "#168A45";

        speak(
            "Voice navigation started. " +
            "Navigating to " +
            destination.name
        );

    } else {

        this.innerHTML =
            "🔇 Voice Navigation OFF";

        this.style.background =
            "#1677FF";

        window.speechSynthesis.cancel();
    }

});


/* =========================================
   ROUTE
   ========================================= */

function updateRoute(start) {

    document.getElementById(
        "routeDetails"
    ).innerHTML =
        "🔄 Calculating route...";


    const routeURL =
        "https://router.project-osrm.org/route/v1/driving/" +

        start.lng + "," +
        start.lat +

        ";" +

        destination.lng + "," +
        destination.lat +

        "?overview=full&steps=true&geometries=geojson";


    fetch(routeURL)

    .then(response => response.json())

    .then(data => {

        if (
            !data.routes ||
            data.routes.length === 0
        ) {

            document.getElementById(
                "routeDetails"
            ).innerHTML =
                "❌ Route not found.";

            return;
        }


        const route =
            data.routes[0];


        /* REMOVE OLD ROUTE */

        if (routeLine) {
            map.removeLayer(routeLine);
        }


        /* DRAW ROUTE */

        routeLine =
            L.geoJSON(
                route.geometry,
                {
                    style: {
                        color: "#1677FF",
                        weight: 6,
                        opacity: 0.85
                    }
                }
            ).addTo(map);


        /* ROUTE STEPS */

        routeSteps =
            route.legs[0].steps;


        /* DISTANCE */

        const distanceMeters =
            route.distance;


        let distanceText;


        if (distanceMeters < 1000) {

            distanceText =
                Math.round(distanceMeters) +
                " m";

        } else {

            distanceText =
                (distanceMeters / 1000)
                .toFixed(2) +
                " km";
        }


        /* WALKING TIME */

        const walkingMinutes =
            Math.max(
                1,
                Math.ceil(
                    distanceMeters /
                    1.4 /
                    60
                )
            );


        /* DISPLAY */

        document.getElementById(
            "routeDetails"
        ).innerHTML =

            "📍 <b>You are here</b><br>" +

            "🎯 <b>" +
            destination.name +
            "</b><br>" +

            "📏 Distance: <b>" +
            distanceText +
            "</b><br>" +

            "⏱️ Walking time: <b>" +
            walkingMinutes +
            " min</b><br>" +

            "🚶 Walking route";


        /* DESTINATION CHECK */

        const remaining =
            start.distanceTo(
                destinationLocation
            );


        if (remaining < 25) {

            if (!destinationReached) {

                destinationReached = true;

                document.getElementById(
                    "reachedMessage"
                ).style.display =
                    "block";

                speak(
                    "You have reached " +
                    destination.name
                );
            }

        } else {

            destinationReached = false;

            document.getElementById(
                "reachedMessage"
            ).style.display =
                "none";
        }

    })

    .catch(error => {

        console.log(error);

        document.getElementById(
            "routeDetails"
        ).innerHTML =
            "❌ Unable to create route.";

    });

}


/* =========================================
   LIVE GPS
   ========================================= */

if (navigator.geolocation) {

    navigator.geolocation.watchPosition(

        function(position) {

            userLocation =
                L.latLng(
                    position.coords.latitude,
                    position.coords.longitude
                );


            /* USER MARKER */

            if (userMarker) {

                userMarker.setLatLng(
                    userLocation
                );

            } else {

                userMarker =
                    L.marker(
                        userLocation
                    )
                    .addTo(map)
                    .bindPopup(
                        "📍 You are here"
                    );

            }


            /* UPDATE ROUTE */

            updateRoute(
                userLocation
            );

        },

        function(error) {

            document.getElementById(
                "routeDetails"
            ).innerHTML =

                "⚠️ Please allow location " +
                "access to start navigation.";

        },

        {
            enableHighAccuracy: true,
            maximumAge: 5000,
            timeout: 10000
        }

    );

} else {

    document.getElementById(
        "routeDetails"
    ).innerHTML =
        "❌ Geolocation is not supported.";

}

</script>

</body>

</html>
