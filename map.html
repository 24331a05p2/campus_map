<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width, initial-scale=1.0">

<title>MVGR Campus Navigation</title>

<link
rel="stylesheet"
href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
/>

<style>

* {
    box-sizing: border-box;
}

body {
    margin: 0;
    font-family: Arial, sans-serif;
    background: #f5f7fa;
}

/* HEADER */

h1 {
    margin: 0;
    height: 82px;

    display: flex;
    align-items: center;
    justify-content: center;

    background: #0B3D6E;
    color: white;

    font-size: 38px;
    font-weight: bold;

    position: relative;
    z-index: 1000;
}

/* MAP */

#map {
    width: 100%;
    height: calc(100vh - 82px);
}

/* INFO CARD */

#routeInfo {

    position: fixed;

    bottom: 20px;
    left: 20px;
    right: 20px;

    background: white;

    padding: 16px;

    border-radius: 16px;

    box-shadow:
        0 4px 18px rgba(0,0,0,0.25);

    z-index: 1000;

    max-width: 500px;

    margin: auto;
}

#destinationTitle {

    margin: 0 0 8px 0;

    color: #0B2D4D;

    font-size: 20px;
}

#routeDetails {

    font-size: 15px;

    color: #333;

    line-height: 1.7;
}

/* VOICE BUTTON */

#voiceButton {

    margin-top: 10px;

    width: 100%;

    padding: 12px;

    border: none;

    border-radius: 10px;

    background: #1677FF;

    color: white;

    font-size: 15px;

    font-weight: bold;

    cursor: pointer;
}

/* REACHED */

#reachedMessage {

    display: none;

    margin-top: 10px;

    padding: 10px;

    border-radius: 10px;

    background: #DFF7E5;

    color: #167A35;

    font-weight: bold;

    text-align: center;
}

</style>

</head>


<body>


<h1>
🗺️ MVGR Campus Map
</h1>


<div id="map"></div>


<div id="routeInfo">

<h3 id="destinationTitle">
🎯 Finding destination...
</h3>

<div id="routeDetails">
📍 Finding your live location...
</div>

<button id="voiceButton">
🔊 Start Voice Navigation
</button>

<div id="reachedMessage">
🏁 You have reached your destination!
</div>

</div>


<script
src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js">
</script>


<script>

/* =====================================================
   1. DEPARTMENT DESTINATIONS
   ===================================================== */

const destinations = {

    // =========================
    // DEPARTMENTS
    // =========================

    cse: {
        name: "CSE Department",
        fullName: "Computer Science & Engineering",
        lat: 18.059794897461078,
        lng: 83.40501710170741
    },

    it: {
        name: "IT Department",
        fullName: "Information Technology",
        lat: 18.06089142240757,
        lng: 83.40532827907694
    },

    eee: {
        name: "EEE Department",
        fullName: "Electrical & Electronics Engineering",
        lat: 18.061814538103587,
        lng: 83.4055106565274
    },

    ece: {
        name: "ECE Department",
        fullName: "Electronics & Communication Engineering",
        lat: 18.060100905111256,
        lng: 83.4044054743864
    },

    mechanical: {
        name: "Mechanical Department",
        fullName: "Mechanical Engineering",
        lat: 18.060090704864844,
        lng: 83.40392261578708
    },

    civil: {
        name: "Civil Department",
        fullName: "Civil Engineering",
        lat: 18.062105242042335,
        lng: 83.40400305582341
    },

    chemical: {
        name: "Chemical Department",
        fullName: "Chemical Engineering",
        lat: 18.061814538103587,
        lng: 83.4055106565274
    },


    // =========================
    // NEARBY PLACES
    // =========================

    canteen: {
        name: "Canteen",
        fullName: "MVGR Canteen",
        lat: 18.061704376493115,
        lng: 83.40495335568
    },

    library: {
        name: "Central Library",
        fullName: "MVGR Central Library",
        lat: 18.061439172314017,
        lng: 83.40629482725954
    },

    admin: {
        name: "Administrative Block",
        fullName: "MVGR Administrative Block",
        lat: 18.0602049475987,
        lng: 83.40567247252052
    },

    sports: {
        name: "Sports Ground",
        fullName: "MVGR Sports Ground",
        lat: 18.060623156944448,
        lng: 83.40667038615378
    },

    boysHostel: {
        name: "Boys Hostel",
        fullName: "MVGR Boys Hostel",
        lat: 18.058715706235567,
        lng: 83.40385084083048
    },

    health: {
        name: "Health Center",
        fullName: "MVGR Health Center",
        lat: 18.059193080861125,
        lng: 83.4050655376415
    },

    bus: {
        name: "Bus Stop",
        fullName: "MVGR Bus Stop",
        lat: 18.062132782398326,
        lng: 83.40521099218189
    }

};


/* =====================================================
   2. GET SELECTED DEPARTMENT FROM URL
   ===================================================== */

const params =
new URLSearchParams(
    window.location.search
);


const selected =
params.get("destination") || "cse";


const destination =
destinations[selected] ||
destinations.cse;


/* =====================================================
   3. SHOW SELECTED DEPARTMENT NAME
   ===================================================== */

document.getElementById(
    "destinationTitle"
).innerHTML =

"🎯 " +
destination.name;


/* =====================================================
   4. CREATE MAP
   ===================================================== */

const map =
L.map("map").setView(

    [18.060619, 83.405117],

    17

);


/* =====================================================
   5. OPEN STREET MAP
   ===================================================== */

L.tileLayer(

    "https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png",

    {

        attribution:
        "&copy; OpenStreetMap contributors"

    }

).addTo(map);


/* =====================================================
   6. DESTINATION LOCATION
   ===================================================== */

const destinationLocation =

L.latLng(

    destination.lat,

    destination.lng

);


/* =====================================================
   7. DESTINATION MARKER
   ===================================================== */

const destinationIcon = L.divIcon({

    className: "",

    html: `
        <div style="
            background:#FF0000;
            width:28px;
            height:28px;
            border-radius:50% 50% 50% 0;
            transform:rotate(-45deg);
            border:3px solid white;
            box-shadow:0 2px 8px rgba(0,0,0,0.4);
        ">
            <div style="
                width:8px;
                height:8px;
                background:white;
                border-radius:50%;
                margin:7px;
            "></div>
        </div>
    `,

    iconSize: [28,28],

    iconAnchor: [14,28],

    popupAnchor: [0,-28]

});


const destinationMarker =

L.marker(

    destinationLocation,

    {
        icon: destinationIcon
    }

)

.addTo(map)

.bindPopup(

    "<b>🎯 " +
    destination.name +
    "</b><br>" +

    destination.fullName

);


/* =====================================================
   8. VARIABLES
   ===================================================== */

let userLocation = null;

let userMarker = null;

let routeLine = null;

let voiceEnabled = false;

let destinationReached = false;

let firstLocationReceived = false;


/* =====================================================
   9. VOICE FUNCTION
   ===================================================== */

function speak(text) {

    if (!voiceEnabled) {
        return;
    }


    if (!("speechSynthesis" in window)) {

        return;
    }


    window.speechSynthesis.cancel();


    const speech =
    new SpeechSynthesisUtterance(text);


    speech.lang = "en-IN";

    speech.rate = 0.9;


    window.speechSynthesis.speak(
        speech
    );

}


/* =====================================================
   10. VOICE BUTTON
   ===================================================== */

document.getElementById(
    "voiceButton"
)

.addEventListener(

    "click",

    function() {

        voiceEnabled =
        !voiceEnabled;


        if (voiceEnabled) {

            this.innerHTML =
            "🔊 Voice Navigation ON";


            this.style.background =
            "#168A45";


            speak(

                "Voice navigation started. " +

                "Navigating to " +

                destination.name

            );

        }


        else {

            this.innerHTML =
            "🔇 Voice Navigation OFF";


            this.style.background =
            "#1677FF";


            window.speechSynthesis.cancel();

        }

    }

);


/* =====================================================
   11. ROUTE FUNCTION
   ===================================================== */

function updateRoute(start) {


    document.getElementById(
        "routeDetails"
    ).innerHTML =

    "🔄 Calculating route to " +

    destination.name +

    "...";


    /* -----------------------------------------------
       OSRM ROUTE URL
       ----------------------------------------------- */

    const routeURL =

    "https://router.project-osrm.org/route/v1/driving/" +

    start.lng +
    "," +
    start.lat +

    ";" +

    destination.lng +
    "," +
    destination.lat +

    "?overview=full" +
    "&steps=true" +
    "&geometries=geojson";


    /* -----------------------------------------------
       FETCH ROUTE
       ----------------------------------------------- */

    fetch(routeURL)


    .then(

        response =>
        response.json()

    )


    .then(

        data => {


            /* ---------------------------------------
               CHECK ROUTE
               --------------------------------------- */

            if (

                !data.routes ||

                data.routes.length === 0

            ) {

                document.getElementById(
                    "routeDetails"
                ).innerHTML =

                "❌ Route not found.";

                return;

            }


            /* ---------------------------------------
               GET FIRST ROUTE
               --------------------------------------- */

            const route =
            data.routes[0];


            /* ---------------------------------------
               REMOVE OLD ROUTE
               --------------------------------------- */

            if (routeLine) {

                map.removeLayer(
                    routeLine
                );

            }


            /* ---------------------------------------
               DRAW BLUE ROUTE
               --------------------------------------- */

            routeLine =

            L.geoJSON(

                route.geometry,

                {

                    style: {

                        color:
                        "#1677FF",

                        weight:
                        6,

                        opacity:
                        0.9

                    }

                }

            ).addTo(map);


            /* ---------------------------------------
               DISTANCE
               --------------------------------------- */

            const distanceMeters =
            route.distance;


            let distanceText;


            if (distanceMeters < 1000) {

                distanceText =

                Math.round(
                    distanceMeters
                ) +

                " m";

            }

            else {

                distanceText =

                (
                    distanceMeters /
                    1000
                )

                .toFixed(2) +

                " km";

            }


            /* ---------------------------------------
               WALKING TIME
               --------------------------------------- */

            const walkingMinutes =

            Math.max(

                1,

                Math.ceil(

                    distanceMeters /
                    1.4 /
                    60

                )

            );


            /* ---------------------------------------
               DISPLAY ROUTE INFORMATION
               --------------------------------------- */

            document.getElementById(
                "routeDetails"
            ).innerHTML =

            "📍 <b>You are here</b><br>" +

            "🎯 <b>" +
            destination.name +
            "</b><br>" +

            "📏 Distance: <b>" +
            distanceText +
            "</b><br>" +

            "⏱️ Walking time: <b>" +
            walkingMinutes +
            " min</b><br>" +

            "🚶 Walking route";


            /* ---------------------------------------
               SHOW BOTH MARKERS + ROUTE
               --------------------------------------- */

            if (!firstLocationReceived) {

                const bounds =
                L.latLngBounds([

                    start,

                    destinationLocation

                ]);


                map.fitBounds(

                    bounds,

                    {

                        padding:
                        [60, 60],

                        maxZoom:
                        18

                    }

                );


                firstLocationReceived =
                true;

            }


            /* ---------------------------------------
               DESTINATION REACHED
               --------------------------------------- */

            const remaining =

            start.distanceTo(

                destinationLocation

            );


            if (remaining < 25) {


                if (!destinationReached) {

                    destinationReached =
                    true;


                    document.getElementById(
                        "reachedMessage"
                    ).style.display =
                    "block";


                    speak(

                        "You have reached " +

                        destination.name

                    );

                }

            }


            else {

                destinationReached =
                false;


                document.getElementById(
                    "reachedMessage"
                ).style.display =
                "none";

            }

        }

    )


    .catch(

        error => {

            console.log(
                "Route error:",
                error
            );


            document.getElementById(
                "routeDetails"
            ).innerHTML =

            "❌ Unable to create route.";

        }

    );

}


/* =====================================================
   12. LIVE GPS
   ===================================================== */

if (navigator.geolocation) {


    navigator.geolocation.watchPosition(


        function(position) {


            /* ---------------------------------------
               GET LIVE LOCATION
               --------------------------------------- */

            userLocation =

            L.latLng(

                position.coords.latitude,

                position.coords.longitude

            );


            /* ---------------------------------------
               CREATE / UPDATE USER MARKER
               --------------------------------------- */

            if (userMarker) {


                userMarker.setLatLng(

                    userLocation

                );

            }


            else {


                userMarker =

                L.marker(

                    userLocation

                )

                .addTo(map)

                .bindPopup(

                    "📍 You are here"

                );


            }


            /* ---------------------------------------
               CREATE ROUTE
               --------------------------------------- */

            updateRoute(

                userLocation

            );

        },


        function(error) {


            console.log(
                "GPS Error:",
                error
            );


            document.getElementById(
                "routeDetails"
            ).innerHTML =

            "⚠️ Please allow location " +

            "access to start navigation.";

        },


        {

            enableHighAccuracy:
            true,

            maximumAge:
            5000,

            timeout:
            10000

        }

    );

}


else {


    document.getElementById(
        "routeDetails"
    ).innerHTML =

    "❌ Geolocation is not supported.";

}


</script>


</body>

</html>
